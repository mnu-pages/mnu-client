name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libcurl4-openssl-dev make

      - name: Build
        run: |
          make CC=clang OUT=build/mnu-linux-x64

      - name: Upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/mnu-linux-x64

  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/work" -w /work \
            arm64v8/ubuntu:22.04 bash -lc "
              apt-get update &&
              apt-get install -y clang libcurl4-openssl-dev make &&
              make CC=clang OUT=build/mnu-linux-arm64
            "

      - name: Upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/mnu-linux-arm64

  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-curl
            make

      - name: Build
        run: |
          make CC=clang OUT=build/mnu-windows-x64.exe

      - name: Upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/mnu-windows-x64.exe
