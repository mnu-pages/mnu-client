name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent release creation
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes || echo "Release already exists"

  build:
    name: Build for ${{ matrix.target_os }}-${{ matrix.target_arch }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            target_arch: x86_64
          - os: ubuntu-24.04-arm
            target_os: linux
            target_arch: aarch64
          - os: macos-13
            target_os: macos
            target_arch: x86_64
          - os: macos-latest
            target_os: macos
            target_arch: aarch64
          - os: windows-latest
            target_os: windows
            target_arch: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev pkg-config make

      - name: Install dependencies (macOS)
        if: matrix.target_os == 'macos'
        run: brew install curl pkg-config

      - name: Setup MSYS2 (Windows)
        if: matrix.target_os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-curl mingw-w64-x86_64-pkg-config make

      - name: Build (Linux/macOS)
        if: matrix.target_os != 'windows'
        run: |
          ASSET_NAME="mnu-${{ matrix.target_os }}-${{ matrix.target_arch }}"
          make clean
          make OUT="$ASSET_NAME"

      - name: Build (Windows)
        if: matrix.target_os == 'windows'
        shell: msys2 {0}
        run: |
          ASSET_NAME="mnu-${{ matrix.target_os }}-${{ matrix.target_arch }}.exe"
          make clean
          make CC=gcc OUT="$ASSET_NAME"

      - name: Upload Asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_NAME="mnu-${{ matrix.target_os }}-${{ matrix.target_arch }}"
          if [ "${{ matrix.target_os }}" == "windows" ]; then ASSET_NAME="${ASSET_NAME}.exe"; fi
          
          # Upload directly without race-prone existence checks (needs: create-release handles the wait)
          gh release upload "${{ github.ref_name }}" "$ASSET_NAME" --clobber
