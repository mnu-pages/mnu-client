name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view ${{ github.ref_name }} >/dev/null 2>&1; then
            gh release create ${{ github.ref_name }} \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes
          fi

  build:
    name: Build for ${{ matrix.target_os }}-${{ matrix.target_arch }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            target_arch: x86_64
          - os: ubuntu-24.04-arm
            target_os: linux
            target_arch: aarch64
          - os: macos-13
            target_os: macos
            target_arch: x86_64
          - os: macos-latest
            target_os: macos
            target_arch: aarch64
          - os: windows-latest
            target_os: windows
            target_arch: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev pkg-config make

      - name: Install dependencies (macOS)
        if: matrix.target_os == 'macos'
        run: brew install curl pkg-config

      - name: Setup MSYS2 (Windows)
        if: matrix.target_os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-curl mingw-w64-x86_64-pkg-config make

      - name: Build (Windows)
        if: matrix.target_os == 'windows'
        shell: msys2 {0}
        run: |
          make clean
          # Force static linking for a standalone binary
          make CC=gcc CFLAGS="-DCURL_STATICLIB" LIBS="$(pkg-config --libs --static libcurl) -static"

      - name: Build (Linux/macOS)
        if: matrix.target_os != 'windows'
        run: |
          make clean
          make

      - name: Rename and Upload Asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Deterministic path handling
          BINARY="build/mnu"
          if [ "${{ matrix.target_os }}" == "windows" ]; then BINARY="build/mnu.exe"; fi
          
          # Strict naming convention: mnu-{os}-{arch}
          ASSET_NAME="mnu-${{ matrix.target_os }}-${{ matrix.target_arch }}"
          if [ "${{ matrix.target_os }}" == "windows" ]; then ASSET_NAME="${ASSET_NAME}.exe"; fi
          
          mv "$BINARY" "$ASSET_NAME"
          gh release upload ${{ github.ref_name }} "$ASSET_NAME" --clobber
