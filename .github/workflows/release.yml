name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            asset_name: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            asset_name: linux-aarch64
          - os: macos-13
            platform: macos-x86_64
            asset_name: macos-x86_64
          - os: macos-latest
            platform: macos-aarch64
            asset_name: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
            asset_name: windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev pkg-config make

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install curl pkg-config

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-pkg-config
            make

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make clean
          # Use static linking for a standalone Windows binary
          # We define CURL_STATICLIB to ensure the compiler doesn't look for DLL exports
          make CC=gcc CFLAGS="-DCURL_STATICLIB" LIBS="$(pkg-config --libs --static libcurl) -static"

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          make clean
          make

      - name: Prepare assets
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ runner.os }}" == "Windows" ]; then EXT=".exe"; fi
          # Final format: <platform>-<version>.<extension>
          cp build/mnu${EXT} dist/${{ matrix.asset_name }}-${{ github.ref_name }}${EXT}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
