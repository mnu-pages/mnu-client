name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if the release already exists to avoid errors on re-runs
          if ! gh release view ${{ github.ref_name }} >/dev/null 2>&1; then
            gh release create ${{ github.ref_name }} \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes
          else
            echo "Release ${{ github.ref_name }} already exists. Skipping creation."
          fi

  build:
    name: Build for ${{ matrix.platform }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            asset_name: mnu-linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            asset_name: mnu-linux-aarch64
          - os: macos-latest
            platform: macos-aarch64
            asset_name: mnu-macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
            asset_name: mnu-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev pkg-config make

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install curl pkg-config

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-pkg-config
            make

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make clean
          # Use static linking for a standalone Windows binary
          make CC=gcc CFLAGS="-DCURL_STATICLIB" LIBS="$(pkg-config --libs --static libcurl) -static"

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          make clean
          make

      - name: Rename and Upload Asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXT=""
          if [ "${{ runner.os }}" == "Windows" ]; then EXT=".exe"; fi
          SRC="build/mnu${EXT}"
          DEST="${{ matrix.asset_name }}"
          
          # Rename to the target asset name
          mv "$SRC" "$DEST"
          
          # Upload using GitHub CLI
          gh release upload ${{ github.ref_name }} "$DEST" --clobber
